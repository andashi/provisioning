name: lock refresh

# Keeps apks/lock.json current without a person (decision 0013). On
# 2026-09-30, 10 of about 20 checkable apps in the lock were behind upstream,
# among them Signal, Bitwarden, Orbot and Tor Browser.
#
# It runs apks/refresh-lock.sh - fetch both ABIs, verify hashes and pinned
# signers, lock - and acts on its verdict:
#
#   unchanged  nothing to do
#   safe       new versions under signers already pinned, nothing else:
#              make check, then the lock is committed to the target branch
#              (main) directly. This is the one change that reaches main
#              without a pull request, on purpose and only under these
#              conditions (AGENTS.md, "The lock refresh").
#   review     a signer pinned for the first time, or a version whose bytes
#              or URLs changed: main is left alone, the result is pushed to a
#              branch, and an issue labelled lock-refresh asks for a look.
#
# A run that fails - a signer that CHANGED makes fetch.sh reject the build and
# fail - opens or updates the same kind of issue. So the maintainer is
# involved exactly when something is unusual, and otherwise never.
#
# Everything uses GITHUB_TOKEN: pushing and opening issues need no extra
# token and no repository setting. A push with GITHUB_TOKEN starts no
# workflows, so the job dispatches `verify` on the new head itself -
# bin/pr-gate requires a green run on main before the next merge.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Branch a safe lock is committed to (main; another branch only to test this workflow)
        default: main
        required: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: ${{ inputs.target || 'main' }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || 'main' }}

      - name: A head this job pushed is verified
        # A push with GITHUB_TOKEN starts no workflow, so this job dispatches
        # verify after its own push - and if that dispatch was lost, main's
        # head would stay without the green run bin/pr-gate requires. Every
        # run therefore looks first: a head last committed by this job with
        # no verify run at all gets one now.
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$(git log -1 --format=%ae)" = lock-refresh@users.noreply.github.com ] \
             && [ "$(gh run list --workflow verify --commit "$head" --json databaseId --jq length)" = 0 ]; then
            echo "head ${head:0:12} came from this job and was never verified - dispatching verify"
            gh workflow run verify --ref "$TARGET"
          fi

      - name: Android build tools on PATH
        # The runner image ships the Android SDK; the newest build-tools carry
        # aapt2 and apksigner. Their versions go into the log, so a lock can
        # always be traced to the tools that checked it.
        run: |
          set -euo pipefail
          bt="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$bt" >> "$GITHUB_PATH"
          "$bt/aapt2" version
          "$bt/apksigner" --version
          gpg --version | head -1

      - name: Fetch, verify, lock
        env:
          # Authenticated release queries: 5000 an hour instead of the 60 an
          # unauthenticated runner address shares with everybody else.
          GITHUB_TOKEN: ${{ github.token }}
        run: apks/refresh-lock.sh --summary "$RUNNER_TEMP/summary.md" --verdict "$RUNNER_TEMP/verdict"

      - name: Act on the verdict
        run: |
          set -euo pipefail
          verdict="$(cat "$RUNNER_TEMP/verdict")"
          day="$(date -u +%Y-%m-%d)"
          echo "verdict: $verdict"
          [ "$verdict" != unchanged ] || { echo "The lock is current - nothing to do."; exit 0; }

          make check
          git config user.name "andashi lock refresh"
          git config user.email "lock-refresh@users.noreply.github.com"
          git add apks/lock.json apks/SHA256SUMS apks/certs
          { echo "Lock refresh $day"; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/message"
          # The attribution rule, applied here: no pull request runs
          # commit-hygiene.yml over this commit.
          sh .githooks/commit-msg "$RUNNER_TEMP/message"
          git commit -q -F "$RUNNER_TEMP/message"

          if [ "$verdict" = safe ]; then
            # Straight onto the target. If somebody pushed meanwhile, the lock
            # commit goes on top of theirs; it touches apks/ only, so a
            # conflict means somebody else changed the lock - then a person
            # decides, and main stays as it is.
            for _ in 1 2 3; do
              if git push -q origin "HEAD:$TARGET"; then
                echo "committed to $TARGET: $(git rev-parse --short HEAD)"
                # From here on something WAS changed; a failure report must
                # say so (see the failure step).
                echo "PUSHED=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
                for try in 1 2 3; do
                  gh workflow run verify --ref "$TARGET" && exit 0
                  sleep $((try * 10))
                done
                echo "::error::the lock is on $TARGET, but verify could not be dispatched; the next run retries it"
                exit 1
              fi
              git fetch -q origin "$TARGET"
              git rebase -q "origin/$TARGET" || { git rebase --abort; break; }
              make check
            done
            echo "could not put the lock onto $TARGET - asking for review instead" | tee -a "$RUNNER_TEMP/summary.md"
          fi

          # review: the result on a branch, and an issue that says why.
          branch="lock-refresh-$day"
          git fetch -q origin "$branch" 2>/dev/null || true
          git push -q --force-with-lease origin "HEAD:refs/heads/$branch"
          {
            echo "The scheduled lock refresh found something a person should look at, and left \`$TARGET\` alone."
            echo
            echo "- The proposed lock: branch [\`$branch\`](${{ github.server_url }}/${{ github.repository }}/compare/$TARGET...$branch)"
            echo "- The run: $RUN_URL"
            echo "- To take it after checking: merge the branch through a pull request as usual."
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/issue.md"
          echo "ISSUE_TITLE=Lock refresh $day needs a look" >> "$GITHUB_ENV"
          echo "ISSUE_FILE=$RUNNER_TEMP/issue.md" >> "$GITHUB_ENV"

      - name: A failed run is an issue too
        if: failure()
        run: |
          {
            if [ -n "${PUSHED:-}" ]; then
              echo "The scheduled lock refresh committed the new lock to \`$TARGET\` (${PUSHED:0:12}), but could not start \`verify\` for it."
              echo
              echo "The next run dispatches it by itself. Until verify has run green on that commit, bin/pr-gate refuses merges; to clear it at once: \`gh workflow run verify --ref $TARGET\`."
            else
              echo "The scheduled lock refresh failed, and nothing was changed."
              echo
              echo "The usual cause is a signer that changed upstream: fetch.sh rejects that build and says which app in the log line starting with \`x\`. An upstream that was briefly unreachable is the other one; the next run tries again."
            fi
            echo
            echo "The run, with the reason in its log: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          echo "ISSUE_TITLE=Lock refresh $(date -u +%Y-%m-%d) failed" >> "$GITHUB_ENV"
          echo "ISSUE_FILE=$RUNNER_TEMP/issue.md" >> "$GITHUB_ENV"

      - name: Open or update the issue
        if: always() && env.ISSUE_FILE != ''
        run: |
          set -euo pipefail
          gh label create lock-refresh --color BFD4F2 --description "Raised by the scheduled lock refresh" 2>/dev/null || true
          # One open issue per kind of trouble at a time: a second day with the
          # same problem is a comment on it, not another issue.
          case "$ISSUE_TITLE" in *"needs a look") kind="needs a look";; *) kind="failed";; esac
          open="$(gh issue list --label lock-refresh --state open --json number,title \
                  | jq -r --arg k "$kind" '[.[] | select(.title | endswith($k))][0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$ISSUE_FILE"
            echo "commented on #$open"
          else
            gh issue create --title "$ISSUE_TITLE" --label lock-refresh --body-file "$ISSUE_FILE"
          fi
