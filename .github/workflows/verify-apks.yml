name: verify

on:
  push:
  pull_request:
  # The scheduled lock refresh opens its pull request with GITHUB_TOKEN, which
  # starts no workflows; it dispatches this one on its branch instead
  # (.github/workflows/lock-refresh.yml).
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configuration
        # The failure is collected. A bare loop reports only its LAST
        # iteration, so an invalid file anywhere but the end passed this step
        # green - demonstrated 2026-09-27 with a three-file loop whose middle
        # member was broken: exit 0.
        run: |
          fail=0
          for f in config/*.json; do
            if jq -e . "$f" >/dev/null; then echo "ok: $f"; else echo "invalid: $f"; fail=1; fi
          done
          exit $fail
      - name: Catalog consistency
        run: |
          # Every profile in apps.json must exist in profiles.json
          known=$(jq -r '.profiles[].key' config/profiles.json | sort -u)
          used=$(jq -r '.apps[].profiles[]' config/apps.json | sort -u)
          # Empty lists compare clean, so a jq that failed would read as
          # "nothing is wrong" here. Both sides have to have content.
          [ -n "$known" ] && [ -n "$used" ] \
            || { echo "could not read the catalog or the profiles"; exit 1; }
          bad=$(comm -13 <(echo "$known") <(echo "$used"))
          [ -z "$bad" ] || { echo "Unknown profiles in apps.json: $bad"; exit 1; }
          # Package names unique
          dupes=$(jq -r '.apps[].pkg' config/apps.json | sort | uniq -d)
          [ -z "$dupes" ] || { echo "Duplicate package names: $dupes"; exit 1; }
          # IDs unique
          dupes=$(jq -r '.apps[].id' config/apps.json | sort | uniq -d)
          [ -z "$dupes" ] || { echo "Duplicate app IDs: $dupes"; exit 1; }
          echo "Catalog consistent: $(jq '.apps|length' config/apps.json) apps"
      - name: Show open unverified package names
        # Block scalar, not a plain one: the jq program contains ": ", which
        # YAML would read as a mapping. That single line made the whole file
        # unparseable, so this workflow never ran at all until 2026-09-20.
        run: |
          jq -r '.apps[]|select(.pkg_status=="unverified")|"TODO check package name: \(.label) -> \(.pkg)"' config/apps.json

  # The same gate a person runs before committing. The jobs above predate it
  # and check a subset; this one is the whole of it - generated files in sync,
  # the schema, and every case file - so a pull request cannot be green here
  # while `make check` is red on the laptop.
  make-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned shellcheck and actionlint
        # Fixed versions with their sha256, not whatever the runner image
        # carries: a new rule in a floating version would turn every pull
        # request red overnight, and an unpinned download is a script nobody
        # checked running in CI.
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          curl -fsSL -o sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  sc.tar.xz" | sha256sum -c
          tar -xJf sc.tar.xz && mv shellcheck-v0.11.0/shellcheck "$bin/"
          curl -fsSL -o al.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tar.gz" | sha256sum -c
          tar -xzf al.tar.gz actionlint && mv actionlint "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
      - name: bash -n, shellcheck, actionlint
        # Every tracked script, found by its first line - bin/pr-gate,
        # bin/andashi and the commit-msg hook have no .sh and were never
        # checked by the *.sh glob this replaces. Blocking: a warning is a
        # failed check, not a line in a log nobody reads.
        run: tests/lint.sh

  # The binaries are deliberately not in git, so hashes and signer certificates
  # cannot be verified here - apks/verify.sh would find nothing and exit 0,
  # which is a green light for work not done. That check belongs where the
  # binaries are: `make apks` locally, before a pin is committed.
  # What IS checkable without binaries is whether the pins and the catalog
  # still describe the same set of apps.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pins match the catalog
        run: |
          fail=0
          for f in apks/certs/*.cert; do
            p="$(basename "$f" .cert)"
            jq -e --arg p "$p" '.apps[]|select(.pkg==$p)' config/apps.json >/dev/null \
              || { echo "orphaned certificate: $p is not in config/apps.json"; fail=1; }
          done
          while read -r p; do
            [ -z "$p" ] && continue
            jq -e --arg p "$p" '.apps[]|select(.pkg==$p)' config/apps.json >/dev/null \
              || { echo "orphaned hash: $p is not in config/apps.json"; fail=1; }
          done < <(awk '{print $2}' apks/SHA256SUMS | sed 's|.*/||; s|-[0-9].*||' | sort -u)
          certs=(apks/certs/*.cert)
          [ "$fail" = "0" ] && echo "pins consistent: ${#certs[@]} certificates"
          exit $fail
